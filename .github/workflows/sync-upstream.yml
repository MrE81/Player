name: Sync upstream and build

# Daily: merge new commits from moneytoo/Player into this fork (keeping the
# buffer change on top), then build a signed APK and publish it as a release.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build even if upstream has no new commits'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/moneytoo/Player.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "No new upstream commits."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # Fails the run (and emails you) if upstream conflicts with the buffer change.
            git merge --no-edit upstream/master
            git push origin HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.sync.outputs.changed == 'true' || inputs.force_build
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build signed APK
        if: steps.sync.outputs.changed == 'true' || inputs.force_build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          chmod +x gradlew
          ./gradlew assembleLatestUniversalRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_PASSWORD }}"
          rm "$RUNNER_TEMP/keystore.jks"

      - name: Publish release
        if: steps.sync.outputs.changed == 'true' || inputs.force_build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/latestUniversal/release/*.apk | head -n1)
          tag="build-$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short HEAD)"
          gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" \
            --title "$(basename "$apk" .apk) ($(git rev-parse --short HEAD))" \
            --notes "Upstream moneytoo/Player merged with the 275 MB buffer change. Commit $(git rev-parse HEAD)." \
            --latest
